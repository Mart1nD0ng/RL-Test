model:
  slots: 50
  lstm_hidden: 128
  msg_dim: 32

# Simulation size controls (to match expected vis_test style results)
sim:
  num_nodes: 100

physics:
  # ========== 3GPP TR 38.901 UMi Street Canyon ==========
  USE_3GPP_MODEL: true          # Master switch (false = legacy CI model)
  USE_CI_MODEL: true            # Legacy compat flag (ignored when USE_3GPP_MODEL=true)

  # --- Frequency & Geometry ---
  FC_GHZ: 28.0                  # 载波频率 (GHz)
  H_UT: 1.5                     # 用户终端高度 (m)
  H_BS: 10.0                    # 基站/锚节点高度 (m)

  # --- 3GPP UMi Path Loss 系数 (TR 38.901 Table 7.4.1-1) ---
  PL_CONST_LOS: 32.4            # LOS 常数项 (dB)
  PL_COEF_DIST_LOS: 21.0        # LOS 距离对数系数
  PL_COEF_FREQ_LOS: 20.0        # LOS 频率对数系数
  PL_CONST_NLOS: 35.3           # NLOS 常数项
  PL_COEF_DIST_NLOS: 22.4       # NLOS 距离对数系数
  PL_COEF_FREQ_NLOS: 21.3       # NLOS 频率对数系数
  PL_CORRECTION_H: 0.3          # 高度修正系数

  # --- LOS 概率模型 (TR 38.901 Table 7.4.2-1) ---
  LOS_D_BP: 18.0                # 断点距离 (m)：d<=d_bp 时 P_LOS=1
  LOS_DECAY_RATE: 36.0          # 指数衰减率 (m)

  # --- 阴影衰落 (3GPP Table 7.5-6) ---
  SHADOW_SIGMA_LOS: 4.0         # LOS 阴影标准差 (dB)
  SHADOW_SIGMA_NLOS: 7.82       # NLOS 阴影标准差 (dB)
  SHADOW_DCOR_LOS: 10.0         # LOS 去相关距离 (m)
  SHADOW_DCOR_NLOS: 13.0        # NLOS 去相关距离 (m)

  # --- TX / 噪声 ---
  PT_LIN: 0.2                   # 发射功率 (W)，~23 dBm
  NOISE_POWER_LIN: 1.0e-12      # 噪声底 (W)，~-90 dBm

  # --- 硬限制 ---
  MAX_LINK_DIST: 200.0          # 最大链路距离 (m)
  PL_CUTOFF_DB: 140.0           # 路损中断门限 (dB)

  # --- HARQ / MAC 层 ---
  HARQ_MAX_RETRANS: 3           # 最大重传次数 M（总尝试 M+1）
  SLOT_DURATION: 1.0e-3         # 时隙长度 (s)，NR = 1 ms
  BLER_K: 1.5                   # BLER sigmoid 陡峭度
  BLER_SINR_THRESH: 6.0         # BLER 50% 门限 SINR (dB)

  # --- 干扰模型（局部接收端度数驱动） ---
  # N_eff(v) = NOISE_POWER_LIN * (1 + INTERF_K_LOCAL * Degree(v))
  INTERF_K_LOCAL: 0.3           # 局部拥塞干扰系数 λ
  P_NI: 0.1                     # 基准噪声+干扰 (legacy 路径使用)

  # --- Legacy 参数（向后兼容） ---
  D0: 200.0
  B: 2000000.0
  MSG_BITS: 4000.0
  GAMMA: 0.0
  EPS_SUCCESS: 1.0e-12
  PT: 1.0
  ALPHA: 1.7
  Z: 1.0
  R_A: 150.0
  NLOS_ATTEN: 0.25
  MAX_DELAY: 1.0
  MAX_ENERGY: 200.0
  PL_N_LOS: 2.0
  PL_N_NLOS: 2.9
  CORNER_LOSS_DB: 8.0

reward_weights:
  consensus: 2.0
  robustness: 0.1
  energy: 0.5
  delay: 0.5
  density_penalty: 0.5
  long_edge: 0.3
  edit: 0.1

safety:
  min_cross_edges_per_neighbor: 2
  deltaE_budget_per_step: 30
  cooldown_steps: 20
  # 是否强制“邻接分区跨边配额”由安全模块自动补齐。
  # 训练时建议关闭（让策略自己学会在需要时建立跨边），否则会引入非学习的结构性偏置。
  enforce_cross_edge_quota: false

halo:
  mode: 'rhop'
  r: 1
  radius: 1.0
  buckets: 8
  topk: 4

merge:
  cross_policy: 'and'
  score_thresh: 0.2

partition:
  scheme: 'geo_honeycomb'
  cell_size: 100.0
  rebalance: 'local_min_cost_flow'
  # 允许每个agent的容量略微超载，避免“远距离溢出分配”导致治理区域凸包膨胀/重叠
  overload_tol: 1.3
  rho_high: 0.90
  rho_low: 0.58
  T_high: 120
  T_low: 150

messaging:
  ttl: 3
  dropout: 0.2
  enable_quant_noise: true
  quant_levels: 32
  quant_eps: 0.01

training:
  gamma: 0.99
  gae_lambda: 0.95
  lr: 0.0003
  clip: 0.15
  # KL目标略放宽，避免lr过早被压到极小导致训练冻结
  target_kl: 0.03
  adapt_lr_on_kl: true
  truncation_steps: 128
  # KL自适应降lr的下限（不要太低，否则无法学习）
  min_lr: 0.0001
  rollout_len: 512
  epochs: 8
  minibatch_size: 128
  m_min: 8
  m_max: 32
  m_fixed: 10
  # validation m-sweep 参数
  m_grid: [6, 8, 12, 16, 24, 32]
  m_repeats: 2
  verbose: true
  # run_name: null 表示使用时间戳自动命名
  run_name: null
  episodes: 1200
  max_steps_per_episode: 256
  early_stop:
    enable: false
    metric: 'success_rate'
    patience_episodes: 200
    min_delta: 0.002
  checkpoint_interval_episodes: 100
  course_schedule:
    # Phase 1 (Connectivity): No local interference, high consensus weight
    # Goal: learn to build connected topologies freely
    - start: 1
      label: "Phase1_Connectivity"
      physics:
        INTERF_K_LOCAL: 0.0
      reward_weights:
        consensus: 5.0
        robustness: 0.5
        energy: 0.3
        delay: 0.3
        density_penalty: 0.0
        long_edge: 0.2
        edit: 0.05

    # Phase 2 (Robustness): Moderate local interference, introduce density penalty
    # Goal: learn to prune redundant edges while maintaining connectivity
    - start: 150
      label: "Phase2_Robustness"
      physics:
        INTERF_K_LOCAL: 0.1
      reward_weights:
        consensus: 3.0
        robustness: 0.3
        energy: 0.5
        delay: 0.5
        density_penalty: 0.5
        long_edge: 0.3
        edit: 0.1

    # Phase 3 (Target): Full local interference, strong density penalty
    # Goal: converge to sparse, robust small-world topology under realistic conditions
    - start: 400
      label: "Phase3_Target"
      physics:
        INTERF_K_LOCAL: 0.3
      reward_weights:
        consensus: 2.0
        robustness: 0.2
        energy: 0.5
        delay: 0.5
        density_penalty: 2.0
        long_edge: 0.5
        edit: 0.1

loss:
  value_coef: 0.5
  value_clip: 2.0
  normalize_returns: true
  log_value_mean: true
  # === 数学改进参数 (v12) ===
  # 增强熵正则化系数 (配合条件熵计算)
  entropy_coef: 0.02
  # PopArt归一化更新率 (解决return分布非平稳问题)
  popart_beta: 0.0003

autoscale:
  # 启用自动缩放，使智能体数量 = 节点数 / target_slots_per_agent
  enable: true
  target_slots_per_agent: 10
  rho_high: 0.90
  rho_low: 0.58
  min_agents: 2
  max_agents: 128
  warmup_steps: 50
  hysteresis_steps_high: 100
  hysteresis_steps_low: 150

city:
  enable: true
  grid_stride: 100.0
  road_width: 25.0
  speed_mean: 3.0
  speed_std: 0.5
  turn_prob: 0.2
  wrap: true  # Wrap nodes at boundary instead of leaving

region:
  # 区域缩小以增加节点密度和干扰，迫使智能体学习中继路由
  bbox: [ -200.0, -200.0, 200.0, 200.0 ]
  join_margin: 0.0
  leave_margin: 50.0  # Extra margin before node is considered "left"

churn:
  join_rate: 0.0
  leave_policy: 'geofence'
  # 最大节点数 = sim.num_nodes * 1.2
  max_nodes: 120
  # 最小节点数 = sim.num_nodes * 0.8
  min_nodes: 80

topology_init:
  k_nearest: 5
  snr_thresh: 0.0
  # 初始拓扑模式：
  # - 'knn': K近邻（原始行为，基于距离）
  # - 'clique': 全连接但优先内部边，跨区域边限制<50m
  # - 'knn_internal': K近邻优先内部边，每节点只加1条最短跨区域边保证连通
  init_mode: 'knn'

viz:
  enable: true
  save_every_episodes: 50
  draw_topology: true
  draw_agent_coverage: true
  max_graph_nodes_for_plot: 400
  dpi: 160
  # 论文图片设置 - 设为false可生成无图例/标尺的干净图片
  show_legend: false        # 是否显示Agent图例
  show_scale_bar: false     # 是否显示比例尺
  show_stats: false         # 是否显示统计信息文字

logging:
  csv_metrics: true
